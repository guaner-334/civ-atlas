name: CI

# 什么时候跑:
# - PR:改了代码就全查;只改文档(*.md)的,几组检查都跳过,只有最后的「检查汇总」给一个结果
#   (main 的合并保护只认「检查汇总」这一项,所以每个 PR 都得有它)
# - 合并进 main 后马上再全查一轮(合并就发测试网站;PR 查的是合并前那一刻的 main,
#   几个 PR 前后脚合进去时,合起来的样子只有这一轮查得到);同样只改文档的不跑
# - 需要时可以在 Actions 页面手动跑
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

# PR 上有新推送就取消还在跑的旧一轮(同一分支只留最新推送的那一轮)。
# 合进 main 的那一轮:所有 main 上的提交同属一组,不打断正在跑的(cancel-in-progress 为 false,
# 跑到一半取消既浪费已花的时间,也可能让 main 一直没有完整结果);排队时一组里最多只留一个等着的,
# 后来的会顶掉先排着的旧一轮,所以连着合几个 PR 时只有"正在跑的一轮 + 最新的一轮"。
# 被顶掉的旧一轮可以不跑:每个 PR 合并前自己已经全绿过,而最新的 main 一定有一轮完整检查,
# 它包含了前面所有提交合起来的样子。
concurrency:
  group: ${{ github.event_name == 'push' && 'ci-main' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# 几项检查在几台机器上同时跑,总时长 ≈ 最慢的那项。
# 类型检查、单测、压力、构建原来挤在一项里要 17–21 分钟,现在分开:单测分 8 份、压力测试分 3 份,每项十分钟以内;
# 冒烟从头跑到尾约 37 分钟,分 5 份同时跑;类型检查 / 构建和画面回归都只要两三分钟,合在一项里先后跑
jobs:
  # 这次改动里有没有文档(*.md)以外的文件:没有的话下面几组都不用跑
  changes:
    name: 看改了什么
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      # PR 的检查跑在「合进 main 以后的样子」上,多取一层才看得到 main 那一头
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - name: 有没有文档以外的改动
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        # 拿不准(比不出来、没有文件)一律当成改了代码,宁可多跑。
        # --no-renames:把代码文件改名成 .md 时,原来那个文件名也要列出来,不然会被当成只改了文档
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ]; then
            if files=$(git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD) && ! printf '%s\n' "$files" | grep -qv '\.md$'; then
              code=false
            fi
          fi
          echo "改了文档以外的文件:$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  build:
    name: 类型检查 / 构建 / 画面回归
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # 平常四分半左右(类型检查 / 构建一分半,画面回归三分钟)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 安装依赖
        id: install
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm typecheck
      - name: 生产构建
        run: pnpm build
      # 打开网站时首页要下载的代码 + 样式(gzip)不超过上限;超了怎么办见 scripts/first-load.ts 开头
      - name: 首页下载量
        run: pnpm size
      # 下面画面回归的几步不管上面类型检查 / 构建过没过都照样跑(依赖装好了就跑),一次看全;
      # 这一项要上下两部分都过才算过,哪一步没过在检查页的步骤列表里看得出来
      - name: 读取 Playwright 版本
        id: pw
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # 浏览器按 Playwright 版本缓存;升级 Playwright 时自动重新下载
      - name: 缓存无头浏览器
        id: pw-cache
        if: ${{ !cancelled() && steps.pw.outcome == 'success' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-shell
      - name: 安装无头浏览器(缓存未命中时)
        if: ${{ !cancelled() && steps.pw.outcome == 'success' && steps.pw-cache.outputs.cache-hit != 'true' }}
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: 画面回归检查
        id: visual
        if: ${{ !cancelled() && steps.pw.outcome == 'success' }}
        run: pnpm test:visual
      - name: 上传画面差异图
        if: ${{ !cancelled() && steps.visual.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: snaps/visual-diff/
          retention-days: 14

  # 插件沙箱:插件把能想到的坏事在三个浏览器引擎里各试一遍,另起的收信站收到任何东西就算没过
  sandbox:
    name: 插件沙箱
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 读取 Playwright 版本
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: 缓存无头浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-sandbox
      # 缓存命中时只装 WebKit、Firefox 要的系统库,浏览器本身不再下载
      - name: 安装三个无头浏览器和系统库
        run: pnpm exec playwright install --with-deps --only-shell chromium webkit firefox
      - name: 插件沙箱检查
        run: pnpm test:sandbox

  # 单测分 8 份同时跑;怎么分(按各文件大概多久,几份差不多快)见 tests/lib/shardSequencer.ts
  test:
    name: 单测 ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # 平常每份五六分钟(含装依赖);GitHub 的机器快慢不一,慢的一台要多花一半时间,留足余量
    timeout-minutes: 25
    strategy:
      # 一份没过不停掉别的几份,一次看全哪些没过
      fail-fast: false
      matrix:
        shard: ['1/8', '2/8', '3/8', '4/8', '5/8', '6/8', '7/8', '8/8']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 单元测试(第 ${{ matrix.shard }} 份)
        run: pnpm test --shard=${{ matrix.shard }}

  # 压力测试分 4 份同时跑(各组按估的耗时从长到短、每组给累计最少的那份,见 scripts/stress.ts 的 group)
  stress:
    name: 压力测试 ${{ matrix.part }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # 四份各约 8.5 分钟(从头跑到尾约 34 分钟,其中规则项每一档的极端值约 6 分钟;GitHub 快的那档机器上快三成多),留足余量
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 极端参数压力测试(第 ${{ matrix.part }} 份)
        run: pnpm stress
        env:
          STRESS_PART: ${{ matrix.part }}

  # 冒烟分 5 份同时跑(各段按先后归份,几段自己开页面的挪到别的份拉平时长,见 scripts/replay-check.ts 的 PART_STARTS、MOVED)
  smoke:
    name: 冒烟 ${{ matrix.part }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # 平常每份八分钟上下(从头跑到尾约三十七分钟),留足余量
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        part: ['1/5', '2/5', '3/5', '4/5', '5/5']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 读取 Playwright 版本
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # 浏览器按 Playwright 版本缓存;升级 Playwright 时自动重新下载
      - name: 缓存无头浏览器
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-shell
      - name: 安装无头浏览器(缓存未命中时)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: 冒烟测试(页面加载 / 回放 / 悬停 / 各界面流程,第 ${{ matrix.part }} 份)
        run: pnpm smoke
        env:
          SMOKE_PART: ${{ matrix.part }}

  # main 的合并保护只认这一项:上面几组都过了它才过;只改文档时上面几组是跳过的,也算过。
  # 分几份跑的检查名字里带份数,份数一改名字就变,所以不让合并保护去认它们的名字。
  # 用 always():这一轮被取消、前面有检查没过时它也要跑出一个「没过」;换成跳过的话,GitHub 会把跳过的必过检查当成通过
  gate:
    name: 检查汇总
    needs: [changes, build, sandbox, test, stress, smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 各组检查的结果
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "各组结果:$RESULTS(改了文档以外的文件:$CODE)"
          for r in $RESULTS; do
            case "$r" in
              success) ;;
              skipped)
                if [ "$CODE" != "false" ]; then echo "改了代码却有检查被跳过"; exit 1; fi ;;
              *) echo "有检查没过或被取消"; exit 1 ;;
            esac
          done
