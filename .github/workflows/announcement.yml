name: 更新公告

# 网站公告(打开网页就弹出,3 秒后能关)不在代码里,在网站根目录的 announcement.json(格式见 src/ui/announcement.ts)。
# 发公告:在 Actions 页面手动跑这个,填标题、正文、详情链接(可不填)。只传这一个文件,不重新构建、不发布网页,
# 打开网站(或刷新)就弹;正式网站、测试网站(/beta/)读的是同一份。标题和正文都不填 = 撤下公告。
# 每跑一次都是新的一条(带新编号):关过上一条的人也会再看到一次。
# 发布用的密钥和「发布网站」一样(见 deploy.yml 开头)。
on:
  workflow_dispatch:
    inputs:
      title:
        description: 标题(40 字以内)。和正文都不填 = 撤下公告
        required: false
        type: string
      body:
        description: 正文(1000 字以内)。分段:在两段之间写 \n
        required: false
        type: string
      link:
        description: 详情链接(可不填,https 开头;填了公告里多一个「查看详情」)
        required: false
        type: string

concurrency:
  group: announcement
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    name: 上传 announcement.json
    if: github.repository == 'guaner-334/civ-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: site
      url: https://atlas.gerdor.top
    steps:
      - name: 写 announcement.json
        env:
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
          LINK: ${{ inputs.link }}
        run: |
          mkdir -p out
          TITLE=$(printf '%s' "$TITLE" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')
          LINK=$(printf '%s' "$LINK" | tr -d '[:space:]')
          if [ -z "$TITLE" ] && [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            echo '{}' > out/announcement.json
          else
            [ -n "$TITLE" ] || { echo "要写标题" >&2; exit 1; }
            [ -n "$(printf '%s' "$BODY" | tr -d '[:space:]')" ] || { echo "要写正文" >&2; exit 1; }
            # 和网页一样的上限(src/ui/announcement.ts 的 parseNotice),超了直接报错,免得网友看到的被截掉一截
            node -e 'process.exit([...process.argv[1]].length > 40 ? 1 : 0)' "$TITLE" || { echo "标题超过 40 字" >&2; exit 1; }
            node -e 'process.exit([...process.argv[1]].length > 1000 ? 1 : 0)' "$BODY" || { echo "正文超过 1000 字" >&2; exit 1; }
            if [ -n "$LINK" ]; then
              node -e 'if (new URL(process.argv[1]).protocol !== "https:") process.exit(1)' "$LINK" 2>/dev/null || { echo "详情链接不是 https 开头的网址:$LINK" >&2; exit 1; }
            fi
            ID="$(TZ=Asia/Shanghai date +%Y%m%d-%H%M%S)-${GITHUB_RUN_ID}"
            DAY="$(TZ=Asia/Shanghai date +%F)"
            # 正文里写的 \n(两个字)换成真的换行:Actions 页面的输入框只能写一行
            jq -n --arg id "$ID" --arg date "$DAY" --arg title "$TITLE" --arg body "$BODY" --arg link "$LINK" \
              '{id: $id, date: $date, title: $title, body: ($body | gsub("\\\\n"; "\n")), link: $link} | with_entries(select(.value != ""))' > out/announcement.json
          fi
          cat out/announcement.json
          { echo '要传的 announcement.json:'; echo '```json'; cat out/announcement.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: 准备 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_DEST: ${{ secrets.DEPLOY_DEST }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ] || [ -z "$DEPLOY_DEST" ]; then
            echo "没配发布用的密钥(见 deploy.yml 开头),不上传" >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      # 只传这一个文件到网站根目录;「发布网站」只增不删,不会把它冲掉
      - name: 上传
        env:
          DEPLOY_DEST: ${{ secrets.DEPLOY_DEST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          export RSYNC_RSH="ssh -p ${DEPLOY_PORT:-22} -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=10"
          retry() { local n; for n in 1 2 3 4; do "$@" && return 0; echo "第 $n 次失败,10 秒后重试" >&2; sleep 10; done; return 1; }
          retry rsync -ltz --chmod=F644 out/announcement.json "$DEPLOY_DEST"
      # 按网页读的方式(不带参数)读回来,对得上才算发好了
      - name: 核对网站上读到的
        run: |
          want=$(jq -cS . out/announcement.json)
          for n in 1 2 3 4 5 6; do
            got=$(curl -fsS -H 'Cache-Control: no-cache' https://atlas.gerdor.top/announcement.json | jq -cS . 2>/dev/null || true)
            if [ "$got" = "$want" ]; then
              echo "已发好:https://atlas.gerdor.top/announcement.json" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "第 $n 次读到的是:${got:-(读不到)},10 秒后再读" >&2
            sleep 10
          done
          echo "网站上读到的和刚传的不一样(可能被缓存了)" >&2
          exit 1
