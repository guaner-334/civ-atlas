<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="frame-src 'self'" />
    <meta name="robots" content="noindex" />
    <title>插件隔离自检</title>
    <style>
      /* 插件隔离自检页:一页浅色的检查单,不跟地图换深浅色。行高写死:WebKit 的默认行高比 Chromium 矮,不写 iPhone 上整页往上缩 */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f2f2f4;
        color: var(--ink);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
      }
      .pg {
        display: block;
        max-width: 560px;
        margin: 0 auto;
        padding: 18px 16px 28px;
      }
      .ico {
        display: block;
        flex: none;
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .site {
        font-size: 12px;
        line-height: 17px;
        color: var(--ink-2);
      }
      h1 {
        margin: 4px 0 2px;
        font-size: 24px;
        line-height: 33px;
        font-weight: 700;
      }
      .dev {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        line-height: 18px;
        color: var(--ink-2);
      }
      .dev .ico {
        width: 16px;
        height: 16px;
      }
      .sum {
        display: flex;
        gap: 12px;
        align-items: center;
        margin: 14px 0 6px;
        padding: 14px;
        border-radius: 12px;
        background: var(--surface);
      }
      .sum .big {
        flex: none;
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        color: #fff;
        background: var(--ink-3);
      }
      .sum.ok .big {
        background: var(--ok);
      }
      .sum.bad .big {
        background: var(--err);
      }
      .sum .big .ico {
        width: 24px;
        height: 24px;
        stroke-width: 2.4;
      }
      .sum b {
        display: block;
        font-size: 17px;
        line-height: 24px;
      }
      .sum small {
        display: block;
        margin-top: 2px;
        font-size: 12.5px;
        line-height: 1.45;
        color: var(--ink-2);
      }
      .grp {
        background: var(--surface);
        border-radius: 10px;
        overflow: hidden;
      }
      .ck {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        border-top: 1px solid var(--line);
        font-size: 14px;
        line-height: 20px;
      }
      .ck:first-child {
        border-top: 0;
      }
      .ck .ico {
        width: 20px;
        height: 20px;
      }
      .ck .r {
        margin-left: auto;
        font-size: 13px;
        color: var(--ink-2);
        text-align: right;
      }
      .ck.ok .ico {
        color: var(--ok);
      }
      .ck.bad .ico {
        color: var(--err);
      }
      .ck.bad .r {
        color: var(--err);
        font-weight: 600;
      }
      .ck.bad,
      .why {
        background: rgba(224, 68, 58, 0.05);
      }
      .why {
        padding: 0 12px 10px 42px;
        font-size: 12.5px;
        line-height: 1.55;
        color: var(--ink);
      }
      /* 推演插件那一组:量出来的那句是灰的;慢的右边变黄 */
      .gl {
        margin: 14px 4px 6px;
        font-size: 13px;
        line-height: 18px;
        font-weight: 600;
        color: var(--ink-2);
      }
      .why.note {
        background: none;
        margin-top: -4px;
        padding-bottom: 9px;
        font-size: 12px;
        color: var(--ink-2);
      }
      .ck.slow .ico {
        color: #b97c0c;
      }
      .ck.slow .r {
        color: #8f5d07;
        font-weight: 600;
      }
      /* 查的时候每行转圈 */
      .spin {
        flex: none;
        width: 20px;
        height: 20px;
        padding: 2px;
      }
      .spin::before {
        content: '';
        display: block;
        width: 100%;
        height: 100%;
        border: 2px solid var(--line);
        border-top-color: var(--ink-2);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .sum .big .spin {
        width: 24px;
        height: 24px;
      }
      .sum .big .spin::before {
        border-color: rgba(255, 255, 255, 0.35);
        border-top-color: #fff;
        border-width: 2.4px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .bs {
        display: flex;
        gap: 10px;
        margin-top: 14px;
      }
      .btn {
        flex: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 44px;
        padding: 0 14px;
        border: 0;
        border-radius: 10px;
        background: var(--btn);
        color: var(--ink);
        font: inherit;
        font-size: 15px;
        font-weight: 500;
        white-space: nowrap;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .btn.pri {
        background: var(--accent);
        color: #fff;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .tip {
        margin: 12px 2px 0;
        font-size: 12px;
        line-height: 1.6;
        color: var(--ink-2);
      }
    </style>
  </head>
  <body>
    <main id="app" class="pg"></main>
    <script type="module" src="/src/plugin/selfCheck/main.ts"></script>
  </body>
</html>
